        run: |
          set -euo pipefail
          mkdir -p WebViewApp/WebViewApp WebViewApp/WebViewApp.xcodeproj
          cd WebViewApp

          python3 << 'PYEOF'
          import base64, os

          url = os.environ["BUILD_URL"]
          name = os.environ["BUILD_NAME"]
          bid = os.environ["BUILD_BID"]

          def write_file(path, env_key):
              raw = os.environ[env_key]
              b64 = raw.replace(chr(10), "").replace(" ", "")
              data = base64.b64decode(b64).decode("utf-8")
              data = data.replace("WEBSITE_URL_PLACEHOLDER", url)
              data = data.replace("APPNAME_PLACEHOLDER", name)
              data = data.replace("BUNDLEID_PLACEHOLDER", bid)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w") as f:
                  f.write(data)
              print("  Wrote " + path + " (" + str(len(data)) + " bytes)")

          print("Creating Xcode project files...")
          write_file("WebViewApp/AppDelegate.swift", "B64_SWIFT")
          write_file("WebViewApp/WebViewController.swift", "B64_WVC")
          write_file("WebViewApp/Info.plist", "B64_PLIST")
          write_file("WebViewApp.xcodeproj/project.pbxproj", "B64_PBX")

          print("")
          print("Project structure:")
          for root, dirs, files in os.walk("."):
              for f in files:
                  print("  " + os.path.join(root, f))
          PYEOF

      - name: Build IPA (unsigned)
        run: |
          set -euo pipefail
          cd WebViewApp
          xcodebuild \
            -project WebViewApp.xcodeproj \
            -target WebViewApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=build/Build/Products \
            clean build 2>&1 | tee build.log

          echo ""
          echo "Build log tail:"
          tail -30 build.log

          APP_PATH="build/Build/Products/Release-iphoneos/WebViewApp.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: .app not found at $APP_PATH"
            find build/Build/Products -type d -name "*.app" 2>/dev/null || echo "(no .app found)"
            exit 1
          fi
          echo "SUCCESS: .app built at $APP_PATH"
          ls -la "$APP_PATH"

      - name: Create IPA
        run: |
          set -euo pipefail
          cd WebViewApp
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/WebViewApp.app Payload/
          (cd Payload && zip -r ../WebViewApp.ipa WebViewApp.app)
          echo "IPA created:"
          ls -lh WebViewApp.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: WebViewApp/WebViewApp.ipa
          retention-days: 7

      - name: Build Summary
        run: |
          echo "## Build Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **App Name:** ${{ steps.inputs.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Website URL:** ${{ steps.inputs.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Bundle ID:** ${{ steps.inputs.outputs.bid }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the .ipa from the Artifacts section." >> "$GITHUB_STEP_SUMMARY"
