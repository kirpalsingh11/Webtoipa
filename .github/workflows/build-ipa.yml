name: Build iOS IPA from Website

on:
  repository_dispatch:
    types: [build-ipa]
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Website URL to wrap'
        required: true
      app_name:
        description: 'App Name'
        required: true
      bundle_id:
        description: 'Bundle Identifier'
        required: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "url=${{ github.event.client_payload.website_url }}" >> $GITHUB_OUTPUT
            echo "name=${{ github.event.client_payload.app_name }}" >> $GITHUB_OUTPUT
            echo "bid=${{ github.event.client_payload.bundle_id }}" >> $GITHUB_OUTPUT
          else
            echo "url=${{ inputs.website_url }}" >> $GITHUB_OUTPUT
            echo "name=${{ inputs.app_name }}" >> $GITHUB_OUTPUT
            echo "bid=${{ inputs.bundle_id }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Xcode Project
        run: |
          mkdir -p WebViewApp/WebViewApp
          cd WebViewApp

          # Create the Swift AppDelegate
          cat > WebViewApp/AppDelegate.swift << 'SWIFT'
          import UIKit

          @main
class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication,
                              didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let webVC = WebViewController()
                  webVC.urlString = "WEBSITE_URL_PLACEHOLDER"
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = UINavigationController(rootViewController: webVC)
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          SWIFT

          # Replace placeholder
          sed -i '' "s|WEBSITE_URL_PLACEHOLDER|${{ steps.inputs.outputs.url }}|g" WebViewApp/AppDelegate.swift

          # Create WebViewController
          cat > WebViewApp/WebViewController.swift << 'SWIFT'
          import UIKit
          import WebKit

          class WebViewController: UIViewController, WKNavigationDelegate {
              var urlString: String = ""
              private var webView: WKWebView!
              private var progressView: UIProgressView!

              override func viewDidLoad() {
                  super.viewDidLoad()
                  title = "APPNAME_PLACEHOLDER"
                  view.backgroundColor = .systemBackground

                  // Progress bar
                  progressView = UIProgressView(progressViewStyle: .default)
                  progressView.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(progressView)

                  // WebView
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  webView = WKWebView(frame: .zero, configuration: config)
                  webView.navigationDelegate = self
                  webView.translatesAutoresizingMaskIntoConstraints = false
                  webView.allowsBackForwardNavigationGestures = true
                  view.addSubview(webView)

                  NSLayoutConstraint.activate([
                      progressView.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor),
                      progressView.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      progressView.trailingAnchor.constraint(equalTo: view.trailingAnchor),
                      webView.topAnchor.constraint(equalTo: progressView.bottomAnchor),
                      webView.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      webView.trailingAnchor.constraint(equalTo: view.trailingAnchor),
                      webView.bottomAnchor.constraint(equalTo: view.bottomAnchor),
                  ])

                  if let url = URL(string: urlString) {
                      webView.load(URLRequest(url: url))
                  }

                  webView.addObserver(self, forKeyPath: "estimatedProgress", options: .new, context: nil)
              }

              override func observeValue(forKeyPath keyPath: String?, of object: Any?,
                                        change: [NSKeyValueChangeKey: Any]?, context: UnsafeMutableRawPointer?) {
                  if keyPath == "estimatedProgress" {
                      progressView.progress = Float(webView.estimatedProgress)
                      progressView.isHidden = webView.estimatedProgress >= 1.0
                  }
              }

              func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                  progressView.isHidden = true
              }
          }
          SWIFT

          sed -i '' "s|APPNAME_PLACEHOLDER|${{ steps.inputs.outputs.name }}|g" WebViewApp/WebViewController.swift

          # Create Info.plist
          cat > WebViewApp/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>WebViewApp</string>
              <key>CFBundleIdentifier</key>
              <string>BUNDLEID_PLACEHOLDER</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>APPNAME_PLACEHOLDER</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          PLIST

          sed -i '' "s|BUNDLEID_PLACEHOLDER|${{ steps.inputs.outputs.bid }}|g" WebViewApp/Info.plist
          sed -i '' "s|APPNAME_PLACEHOLDER|${{ steps.inputs.outputs.name }}|g" WebViewApp/Info.plist

