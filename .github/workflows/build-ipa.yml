          				);
          				GCC_WARN_64_TO_32_BIT_CONVERSION = YES;
          				GCC_WARN_ABOUT_RETURN_TYPE = YES_ERROR;
          				GCC_WARN_UNDECLARED_SELECTOR = YES;
          				GCC_WARN_UNINITIALIZED_AUTOS = YES_AGGRESSIVE;
          				GCC_WARN_UNUSED_FUNCTION = YES;
          				GCC_WARN_UNUSED_VARIABLE = YES;
          				IPHONEOS_DEPLOYMENT_TARGET = 15.0;
          				MTL_ENABLE_DEBUG_INFO = INCLUDE_SOURCE;
          				MTL_FAST_MATH = YES;
          				ONLY_ACTIVE_ARCH = YES;
          				SDKROOT = iphoneos;
          				SWIFT_ACTIVE_COMPILATION_CONDITIONS = "DEBUG $(inherited)";
          				SWIFT_OPTIMIZATION_LEVEL = "-Onone";
          			};
          			name = Debug;
          		};
          		A90002 /* Release */ = {
          			isa = XCBuildConfiguration;
          			buildSettings = {
          				ALWAYS_SEARCH_USER_PATHS = NO;
          				ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS = YES;
          				CLANG_ANALYZER_NONNULL = YES;
          				CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION = YES_AGGRESSIVE;
          				CLANG_CXX_LANGUAGE_STANDARD = "gnu++20";
          				CLANG_ENABLE_MODULES = YES;
          				CLANG_ENABLE_OBJC_ARC = YES;
          				CLANG_ENABLE_OBJC_WEAK = YES;
          				CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING = YES;
          				CLANG_WARN_BOOL_CONVERSION = YES;
          				CLANG_WARN_COMMA = YES;
          				CLANG_WARN_CONSTANT_CONVERSION = YES;
          				CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS = YES;
          				CLANG_WARN_DIRECT_OBJC_ISA_USAGE = YES_ERROR;
          				CLANG_WARN_DOCUMENTATION_COMMENTS = YES;
          				CLANG_WARN_EMPTY_BODY = YES;
          				CLANG_WARN_ENUM_CONVERSION = YES;
          				CLANG_WARN_INFINITE_RECURSION = YES;
          				CLANG_WARN_INT_CONVERSION = YES;
          				CLANG_WARN_NON_LITERAL_NULL_CONVERSION = YES;
          				CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF = YES;
          				CLANG_WARN_OBJC_LITERAL_CONVERSION = YES;
          				CLANG_WARN_OBJC_ROOT_CLASS = YES_ERROR;
          				CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER = YES;
          				CLANG_WARN_RANGE_LOOP_ANALYSIS = YES;
          				CLANG_WARN_STRICT_PROTOTYPES = YES;
          				CLANG_WARN_SUSPICIOUS_MOVE = YES;
          				CLANG_WARN_UNREACHABLE_CODE = YES;
          				CLANG_WARN__DUPLICATE_METHOD_MATCH = YES;
          				COPY_PHASE_STRIP = NO;
          				DEBUG_INFORMATION_FORMAT = "dwarf-with-dsym";
          				ENABLE_NS_ASSERTIONS = NO;
          				ENABLE_STRICT_OBJC_MSGSEND = YES;
          				ENABLE_USER_SCRIPT_SANDBOXING = YES;
          				GCC_C_LANGUAGE_STANDARD = gnu17;
          				GCC_NO_COMMON_BLOCKS = YES;
          				GCC_WARN_64_TO_32_BIT_CONVERSION = YES;
          				GCC_WARN_ABOUT_RETURN_TYPE = YES_ERROR;
          				GCC_WARN_UNDECLARED_SELECTOR = YES;
          				GCC_WARN_UNINITIALIZED_AUTOS = YES_AGGRESSIVE;
          				GCC_WARN_UNUSED_FUNCTION = YES;
          				GCC_WARN_UNUSED_VARIABLE = YES;
          				IPHONEOS_DEPLOYMENT_TARGET = 15.0;
          				MTL_ENABLE_DEBUG_INFO = NO;
          				MTL_FAST_MATH = YES;
          				SDKROOT = iphoneos;
          				SWIFT_COMPILATION_MODE = wholemodule;
          				VALIDATE_PRODUCT = YES;
          			};
          			name = Release;
          		};
          		A90003 /* Debug */ = {
          			isa = XCBuildConfiguration;
          			buildSettings = {
          				ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;
          				CODE_SIGN_STYLE = Manual;
          				CODE_SIGN_IDENTITY = "-";
          				CODE_SIGNING_REQUIRED = NO;
          				CODE_SIGNING_ALLOWED = NO;
          				CURRENT_PROJECT_VERSION = 1;
          				GENERATE_INFOPLIST_FILE = NO;
          				INFOPLIST_FILE = WebViewApp/Info.plist;
          				INFOPLIST_KEY_UIApplicationSceneManifest_Generation = NO;
          				INFOPLIST_KEY_UILaunchScreen_Generation = NO;
          				IPHONEOS_DEPLOYMENT_TARGET = 15.0;
          				LD_RUNPATH_SEARCH_PATHS = (
          					"$(inherited)",
          					"@executable_path/Frameworks",
          				);
          				MARKETING_VERSION = 1.0;
          				OTHER_LDFLAGS = "-ObjC";
          				PRODUCT_BUNDLE_IDENTIFIER = BUNDLEID_PLACEHOLDER;
          				PRODUCT_NAME = "$(TARGET_NAME)";
          				SWIFT_EMIT_LOC_STRINGS = YES;
          				SWIFT_VERSION = 5.0;
          				TARGETED_DEVICE_FAMILY = "1,2";
          			};
          			name = Debug;
          		};
          		A90004 /* Release */ = {
          			isa = XCBuildConfiguration;
          			buildSettings = {
          				ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;
          				CODE_SIGN_STYLE = Manual;
          				CODE_SIGN_IDENTITY = "-";
          				CODE_SIGNING_REQUIRED = NO;
          				CODE_SIGNING_ALLOWED = NO;
          				CURRENT_PROJECT_VERSION = 1;
          				GENERATE_INFOPLIST_FILE = NO;
          				INFOPLIST_FILE = WebViewApp/Info.plist;
          				INFOPLIST_KEY_UIApplicationSceneManifest_Generation = NO;
          				INFOPLIST_KEY_UILaunchScreen_Generation = NO;
          				IPHONEOS_DEPLOYMENT_TARGET = 15.0;
          				LD_RUNPATH_SEARCH_PATHS = (
          					"$(inherited)",
          					"@executable_path/Frameworks",
          				);
          				MARKETING_VERSION = 1.0;
          				OTHER_LDFLAGS = "-ObjC";
          				PRODUCT_BUNDLE_IDENTIFIER = BUNDLEID_PLACEHOLDER;
          				PRODUCT_NAME = "$(TARGET_NAME)";
          				SWIFT_EMIT_LOC_STRINGS = YES;
          				SWIFT_VERSION = 5.0;
          				TARGETED_DEVICE_FAMILY = "1,2";
          			};
          			name = Release;
          		};
          /* End XCBuildConfiguration section */

          /* Begin XCConfigurationList section */
          		A70001 /* Build configuration list for PBXNativeTarget "WebViewApp" */ = {
          			isa = XCConfigurationList;
          			buildConfigurations = (
          				A90003 /* Debug */,
          				A90004 /* Release */,
          			);
          			defaultConfigurationIsVisible = 0;
          			defaultConfigurationName = Release;
          			};
          		A70003 /* Build configuration list for PBXProject "WebViewApp" */ = {
          			isa = XCConfigurationList;
          			buildConfigurations = (
          				A90001 /* Debug */,
          				A90002 /* Release */,
          			);
          			defaultConfigurationIsVisible = 0;
          			defaultConfigurationName = Release;
          			};
          /* End XCConfigurationList section */
          };
          	rootObject = A80001 /* Project object */;
          }
          PBX

          # Replace bundle ID placeholder in project file
          sed -i '' "s|BUNDLEID_PLACEHOLDER|${{ steps.inputs.outputs.bid }}|g" WebViewApp.xcodeproj/project.pbxproj

      - name: Build IPA (unsigned)
        run: |
          cd WebViewApp
          xcodebuild \
            -project WebViewApp.xcodeproj \
            -scheme WebViewApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build \
            DERIVED_DATA_PATH=build

      - name: Create IPA
        run: |
          cd WebViewApp
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/WebViewApp.app Payload/
          zip -r WebViewApp.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: WebViewApp/WebViewApp.ipa
          retention-days: 7

      - name: Build Summary
        run: |
          echo "## Build Complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name:** ${{ steps.inputs.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Website URL:** ${{ steps.inputs.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle ID:** ${{ steps.inputs.outputs.bid }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the .ipa from the Artifacts section of this run." >> $GITHUB_STEP_SUMMARY
