          # Replace bundle ID placeholder in project file
          sed -i '' "s|BUNDLEID_PLACEHOLDER|${{ steps.inputs.outputs.bid }}|g" WebViewApp.xcodeproj/project.pbxproj

          # Verify project structure
          echo "Project structure:"
          find . -type f | head -20
          echo ""
          echo "project.pbxproj first line:"
          head -1 WebViewApp.xcodeproj/project.pbxproj

      - name: Build IPA (unsigned)
        run: |
          set -euo pipefail
          cd WebViewApp
          xcodebuild             -project WebViewApp.xcodeproj             -target WebViewApp             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             CODE_SIGN_IDENTITY="-"             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO             -derivedDataPath build             clean build 2>&1 | tee build.log

          echo ""
          echo "Build log tail:"
          tail -30 build.log

          # Verify the .app was produced
          APP_PATH="build/Build/Products/Release-iphoneos/WebViewApp.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: .app not found at $APP_PATH"
            echo "Contents of build/Build/Products:"
            find build/Build/Products -type d -name "*.app" 2>/dev/null || echo "(no .app found anywhere)"
            exit 1
          fi
          echo "SUCCESS: .app found at $APP_PATH"
          ls -la "$APP_PATH"

      - name: Create IPA
        run: |
          set -euo pipefail
          cd WebViewApp
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/WebViewApp.app Payload/
          (cd Payload && zip -r ../WebViewApp.ipa WebViewApp.app)
          echo "IPA created:"
          ls -lh WebViewApp.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: WebViewApp/WebViewApp.ipa
          retention-days: 7

      - name: Build Summary
        run: |
          echo "## Build Complete :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **App Name:** ${{ steps.inputs.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Website URL:** ${{ steps.inputs.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Bundle ID:** ${{ steps.inputs.outputs.bid }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the .ipa from the Artifacts section of this run." >> "$GITHUB_STEP_SUMMARY"
