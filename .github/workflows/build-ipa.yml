name: Build iOS IPA from Website

on:
  repository_dispatch:
    types: [build-ipa]
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Website URL to wrap'
        required: true
      app_name:
        description: 'App Name'
        required: true
      bundle_id:
        description: 'Bundle Identifier'
        required: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get inputs
        id: inputs
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "url=${{ github.event.client_payload.website_url }}" >> "$GITHUB_OUTPUT"
            echo "name=${{ github.event.client_payload.app_name }}" >> "$GITHUB_OUTPUT"
            echo "bid=${{ github.event.client_payload.bundle_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ inputs.website_url }}" >> "$GITHUB_OUTPUT"
            echo "name=${{ inputs.app_name }}" >> "$GITHUB_OUTPUT"
            echo "bid=${{ inputs.bundle_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Xcode Project
        run: |
          set -euo pipefail
          mkdir -p WebViewApp/WebViewApp WebViewApp/WebViewApp.xcodeproj
          cd WebViewApp

          # Decode and write source files from base64
          printf '%s' '' | base64 -D > WebViewApp/AppDelegate.swift
          printf '%s' '' | base64 -D > WebViewApp/WebViewController.swift
          printf '%s' '' | base64 -D > WebViewApp/Info.plist
          printf '%s' '' | base64 -D > WebViewApp.xcodeproj/project.pbxproj

          # Replace placeholders with actual values
          sed -i '' "s|WEBSITE_URL_PLACEHOLDER|${{ steps.inputs.outputs.url }}|g" WebViewApp/AppDelegate.swift
          sed -i '' "s|APPNAME_PLACEHOLDER|${{ steps.inputs.outputs.name }}|g" WebViewApp/WebViewController.swift
          sed -i '' "s|BUNDLEID_PLACEHOLDER|${{ steps.inputs.outputs.bid }}|g" WebViewApp/Info.plist
          sed -i '' "s|APPNAME_PLACEHOLDER|${{ steps.inputs.outputs.name }}|g" WebViewApp/Info.plist
          sed -i '' "s|BUNDLEID_PLACEHOLDER|${{ steps.inputs.outputs.bid }}|g" WebViewApp.xcodeproj/project.pbxproj

          # Verify project structure
          echo "Project files:"
          find . -type f | head -10

      - name: Build IPA (unsigned)
        id: build
        run: |
          set -euo pipefail
          cd WebViewApp
          xcodebuild             -project WebViewApp.xcodeproj             -target WebViewApp             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             CODE_SIGN_IDENTITY="-"             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO             clean build 2>&1 | tee build.log

          echo ""
          echo "Build log tail:"
          tail -30 build.log

          # Locate the .app in default DerivedData
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData             -path "*/Release-iphoneos/WebViewApp.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: .app not found in DerivedData"
            find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null || echo "(no .app found anywhere)"
            exit 1
          fi
          echo "SUCCESS: .app built at $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_OUTPUT"
          ls -la "$APP_PATH"

      - name: Create IPA
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -r "${{ steps.build.outputs.APP_PATH }}" Payload/
          (cd Payload && zip -r ../WebViewApp.ipa WebViewApp.app)
          echo "IPA created:"
          ls -lh WebViewApp.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: WebViewApp.ipa
          retention-days: 7

      - name: Build Summary
        run: |
          echo "## Build Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **App Name:** ${{ steps.inputs.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Website URL:** ${{ steps.inputs.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Bundle ID:** ${{ steps.inputs.outputs.bid }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the .ipa from the Artifacts section of this run." >> "$GITHUB_STEP_SUMMARY
